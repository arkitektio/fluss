projects:
  fluss:
    schema: http://jhnnsrs-lab/fluss/schema
    documents: graphql/*/**.graphql
    extensions:
      turms:
        out_dir: fluss/api
        dump_configuration: true
        dump_schema: true
        exclude_typenames: true
        freeze:
          enabled: true
        options:
          # snake_case is the only python-facing spelling a type checker sees;
          # the GraphQL name stays the wire name. Both still validate.
          alias_mode: split
          enabled: true
          extra: forbid
          types:
            - input
        stylers:
          - type: turms.stylers.default.DefaultStyler
          - type: turms.stylers.appender.AppenderStyler
            append_fragment: ""
        plugins:
          - type: turms.plugins.enums.EnumsPlugin
          - type: turms.plugins.inputs.InputsPlugin
          - type: turms.plugins.fragments.FragmentsPlugin
          - type: turms.plugins.operations.OperationsPlugin
          - type: turms.plugins.funcs.FuncsPlugin
            coercible_scalars:
              ID: rath.scalars.IDCoercible
            expand_input_types:
              - input
            global_kwargs:
              - type: fluss.rath.FlussRath
                key: rath
                description:
                  The client we want to use (defaults to the currently active
                  client)
            definitions:
              - type: subscription
                is_async: true
                use: fluss.funcs.asubscribe
              - type: query
                is_async: true
                use: fluss.funcs.aexecute
              - type: mutation
                is_async: true
                use: fluss.funcs.aexecute
              - type: subscription
                use: fluss.funcs.subscribe
              - type: query
                use: fluss.funcs.execute
              - type: mutation
                use: fluss.funcs.execute
        processors:
          - type: turms.processors.disclaimer.DisclaimerProcessor
        scalar_definitions:
          JSONSerializable: typing.Any
          uuid: str
          Callback: str
          Any: typing.Any
          Arg: typing.Any
          ID: rath.scalars.ID
          EventValue: fluss.scalars.EventValue
          ValueMap: typing.Dict
          AnyDefault: typing.Any
          Identifier: str
          SearchQuery: str
        additional_bases:
          FlowGraph:
            - fluss.traits.Graph
          StreamItem:
            - fluss.traits.MockableTrait
          StreamItemChild:
            - fluss.traits.MockableTrait
  