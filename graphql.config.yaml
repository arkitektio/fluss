projects:
  fluss:
    schema: http://jhnnsrs-lab/fluss/schema
    documents: graphql/*/**.graphql
    extensions:
      turms:
        out_dir: fluss/api
        dump_configuration: true
        dump_schema: true
        exclude_typenames: true
        freeze:
          enabled: true
        options:
          # snake_case is the only python-facing spelling a type checker sees;
          # the GraphQL name stays the wire name. Both still validate.
          alias_mode: split
          enabled: true
          extra: forbid
          types:
            - input
        stylers:
          - type: turms.stylers.default.DefaultStyler
          - type: turms.stylers.appender.AppenderStyler
            append_fragment: ""
        plugins:
          - type: turms.plugins.enums.EnumsPlugin
          - type: turms.plugins.inputs.InputsPlugin
          - type: turms.plugins.fragments.FragmentsPlugin
          - type: turms.plugins.operations.OperationsPlugin
          - type: turms.plugins.client.ClientPlugin
            # Every operation is a method of FlussApi, which Fluss mixes in.
            # Each method hands its operation to execute/aexecute/subscribe/asubscribe
            # of self, which Fluss implements over its rath.
            client_class: FlussApi
            # What the operations need at fluss, read off the schema's
            # `@auth(required_scopes: ...)` on every root field they select: every
            # app using fluss asks for it (arkitekt-spec reads it off the client).
            client_fields:
              - name: __scopes__
                kind: tuple[str, ...]
                collector:
                  type: root_field_directive
                  directive: auth
                  argument: required_scopes
                combine: union
            # The client's own attributes: pydantic lets a field hide a method.
            reserved_from:
              - fluss.fluss.Fluss
            coercible_scalars:
              ID: rath.scalars.IDCoercible
            expand_input_types:
              - input
        processors:
          - type: turms.processors.disclaimer.DisclaimerProcessor
        scalar_definitions:
          JSONSerializable: typing.Any
          uuid: str
          Callback: str
          Any: typing.Any
          Arg: typing.Any
          ID: rath.scalars.ID
          EventValue: fluss.scalars.EventValue
          ValueMap: typing.Dict
          AnyDefault: typing.Any
          Identifier: str
          SearchQuery: str
        # The structure each type is known by across the hub (arkitekt-service's
        # `@identified`), on every class generated for it, a nested selection included.
        class_fields:
          - name: __identifier__
            collector:
              type: type_directive
              directive: identified
              argument: by
        additional_bases:
          FlowGraph:
            - fluss.traits.Graph
          StreamItem:
            - fluss.traits.MockableTrait
          StreamItemChild:
            - fluss.traits.MockableTrait
  