  """The workspace this flow belongs to."""
  workspace: Workspace!

  """
  A content hash of the graph, used to deduplicate identical flows within a workspace.
  """
  hash: String!

  """
  The full node-and-edge graph (nodes, edges and globals) that defines the flow.
  """
  graph: Graph!
}

