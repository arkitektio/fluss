  """SEARCH: filter ports whose values are passed to the query."""
  filters: [ArgPortInput!] = null

  """
  SEARCH, CUSTOM, STATE_CHOICE: the other ports (port paths, `..` traverses children) whose values the query, props or calls may reference.
  """
  dependencies: [String!] = []

  """
  STATE_CHOICE: the agent dependency whose state provides the choices; omitted: the own state.
  """
  dependency: String = null

  """PROXY: the dependency to target."""
  targetDependency: String = null

  """PROXY: the action to target."""
  targetAction: String = null

  """PROXY: the port to target."""
  targetPort: String = null

  """
  STATE_CHOICE: static JSON pointer into the state value that provides the choices. Mutually exclusive with `state_call`.
  """
  statePath: String = null

  """
  STATE_CHOICE: pure UtilCall returning that pointer dynamically; may reference `state`, `value` and `dependencies`. Mutually exclusive with `state_path`.
  """
  stateCall: UtilCallInput = null

  """
  STATE_CHOICE: how to read label/description/logo/value out of each state entry; each accessor is a static pointer or a pure call.
  """
  stateAccessors: [StateAccessorInput!] = null
}

