[project]
name = "fluss"
dynamic = ["version"]
readme = "README.md"
readme-content-type = "text/markdown"
homepage = "https://arkitekt.live"
description = "the next generation of Fluss, a Python library for workflow design"
authors = [{ name = "jhnnsrs", email = "jhnnsrs@gmail.com" }]
requires-python = ">=3.11, <4.0"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "rath>=4",
    "websockets>=15.0.1",
]

[project.optional-dependencies]
# `fluss.engine` (formerly the reaktion-next distribution) executes flows and
# imports rekuest unguarded, so it needs it present. Plain `fluss` does not:
# its own rekuest integration sits behind a try/except in __init__, so the
# dependency stays opt-in rather than being forced on every install.
engine = ["rekuest>=4"]


[tool.uv]
dev-dependencies =  [
    "pytest-asyncio>=0.26.0",
    "pytest-cov>=6.1.1",
    "pytest>=8.3.5",
    "python-semantic-release>=9.21.0",
    "autoflake>=1.7.7,<2",
    "aiohttp>=3.8.3,<4",
    "black>=23.1.0,<24",
    "pytest-aiohttp>=1.0.4,<2",
    "ruff>=0.0.254",
    "dokker>=2",
    "rekuest>=4",
    "basedpyright>=1.21",
]

[tool.basedpyright]
include = ["fluss"]
exclude = ["**/__pycache__", "tests"]
typeCheckingMode = "standard"


[tool.ruff]
extend-select = ["ANN", "D1"]


# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Same as Black.
line-length = 100

[tool.hatch.build.targets.sdist]
include = ["fluss"]

[tool.hatch.build.targets.wheel]
include = ["fluss"]


[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# The version is derived from the nearest git tag (vX.Y.Z); nothing in the
# tree is bumped on release. Shallow CI clones see no tag and get the fallback.
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.pytest.ini_options]
markers = [
    "integration: marks tests that require a running server",
    "define: marks tests that concern to definining a funcionality",
    "shrink: marks tests that concern to serializing inputs to requests to an actor",
    "expand: marks tests that concern to serializing outputs from answers of an actor",
    "actor: marks tests that concern actors",
]

testpaths = ["tests"]


[tool.semantic_release]
# No version_toml/version_variables: the release version lives only in the git
# tag, which hatch-vcs reads at build time. CI runs the version command with
# `commit: false`, so PSR tags HEAD and creates the GitHub Release without
# pushing a bump commit to the branch.
#
# The semantic-release GitHub Action runs in a Docker container without uv, so
# install it first. PSR builds *before* it tags, so hatch-vcs is told the new
# version explicitly ($NEW_VERSION is injected by PSR) instead of deriving a
# `.devN+g...` local version that PyPI would reject.
build_command = """
    python -m pip install 'uv>=0.7.12'
    export SETUPTOOLS_SCM_PRETEND_VERSION="$NEW_VERSION"
    uv build
"""

# main -> stable X.Y.Z. next -> prereleases X.Y.Z-rc.N. N.x -> maintenance.
[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.branches.next]
match = "next"
prerelease = true
prerelease_token = "rc"

# Maintenance branches (1.x, 2.x, ...) cut stable patch/minor releases for an
# older major after a new major has shipped from main.
[tool.semantic_release.branches.maintenance]
match = '^\d+\.x$'
prerelease = false

# Keep the changelog focused on user-facing changes. These patterns only filter
# what's rendered — they do not affect version bumps.
[tool.semantic_release.changelog]
exclude_commit_patterns = [
    '^chore(?:\([^)]*\))?: ',
    '^ci(?:\([^)]*\))?: ',
    '^build(?:\([^)]*\))?: ',
    '^style(?:\([^)]*\))?: ',
    '^test(?:\([^)]*\))?: ',
    '^Merge ',
]

